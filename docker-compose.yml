version: '3'

volumes:
  local_data:
    driver: local

services:
  postgres:
    image: postgres:12
    ports:
      - "5432:5432"
    volumes:
      - local_data:/var/lib/postgresql/data
      - ./docker_postgres_init.sql:/docker-entrypoint-initdb.d/docker_postgres_init.sql
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
  redis:
    image: redis:6
    ports:
      - "6379:6379"
  keycloak:
    image: jboss/keycloak:10.0.2
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_USER=admin
      - KEYCLOAK_PASSWORD=admin
      - KEYCLOAK_IMPORT=/tmp/keycloak_realms/realm.json
      - DB_VENDOR=POSTGRES
      - DB_ADDR=postgres
      - DB_USER=keycloak
      - DB_PASSWORD=password
    volumes:
      - './keycloak/realm.json:/tmp/keycloak_realms/realm.json'
    depends_on:
      - postgres
  mongo:
    image: mongo
    ports:
      - "27017:27017"
  nginx:
    image: nginx:latest
    volumes:
      - ./docker/learninglocker.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - xapi
      - api
      - ui
    ports:
      - 8090:80
    deploy:
      replicas: 1
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure
  xapi:
    image: learninglocker/xapi-service:latest
    env_file:
      - ./docker/xapi.env
    depends_on:
      - redis
      - mongo
    deploy:
      replicas: 2
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure
  api:
    image: learninglocker
    depends_on:
    - redis
    - mongo
    - ui
    environment:
    - SERVICE_TYPE=api
    env_file:
      - ./docker/dockerfile.env
    deploy:
      replicas: 2
      update_config:
        parallelism: 2
      restart_policy:
        condition: on-failure
  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: learninglocker
    environment:
    - SERVICE_TYPE=ui
    - FIRST_TIME=1
    depends_on:
    - mongo
    - redis
    env_file:
      - ./docker/dockerfile.env
    deploy:
      replicas: 1
      update_config:
        parallelism: 2
        delay: 10s
      restart_policy:
        condition: on-failure
